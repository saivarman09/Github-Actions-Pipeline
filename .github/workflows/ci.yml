
name: Stage - Quality, Security, Docker and Artifact Publishing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  quality-security-test-docker:
    name: Quality, Security, Tests and Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Get source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # 3. Install dependencies and tools
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Code quality
      - name: Lint Python code
        run: python -m ruff check .

      # 5. Dependency vulnerability audit
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      # 6. Automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # 7. Verify Docker
      - name: Verify Docker installation
        run: |
          docker --version
          docker info
          docker buildx version

      # 8. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t devops-python-app:${{ github.sha }} .

      # 9. Test Docker container
      - name: Test Docker container
        run: |
          docker run --rm devops-python-app:${{ github.sha }}

      # 10. Log in to GitHub Container Registry
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 11. Publish Docker image to GHCR
      - name: Publish Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_NAME: github-actions-pipeline
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_ID="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}"
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')

          docker tag "devops-python-app:${IMAGE_TAG}" "${IMAGE_ID}:${IMAGE_TAG}"
          docker tag "devops-python-app:${IMAGE_TAG}" "${IMAGE_ID}:latest"

          docker push "${IMAGE_ID}:${IMAGE_TAG}"
          docker push "${IMAGE_ID}:latest"
