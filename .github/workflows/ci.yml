
name: Stage - Quality, Security and Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-security-test-docker:
    name: Quality, Security, Tests and Docker
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # 3. Install project dependencies and tools
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Check code quality
      - name: Lint Python code
        run: python -m ruff check .

      # 5. Scan dependencies for known vulnerabilities
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      # 6. Run automated tests
      - name: Run automated tests
        run: python -m pytest -v

      # 7. Set up Docker Buildx
      - name: Verify Docker installation
        run: |
          docker --version
          docker info
          docker buildx version

      # 8. Build the Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t devops-python-app:${{ github.sha }} .

      # 9. Scan Docker image with Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
            image-ref: devops-python-app:${{ github.sha }}
            format: table
            vuln-type: os,library
            severity: CRITICAL,HIGH
            exit-code: '1'

      # 10. Test the Docker container
      - name: Test Docker container
        run: |
          docker run --rm devops-python-app:${{ github.sha }}
